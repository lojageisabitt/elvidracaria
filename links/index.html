<!DOCTYPE html>
<html lang="pt-br">
  <head>

    <title>E & L Vidraçaria - Links</title>
    <link

      rel="stylesheet"
    />
    <style>
      body {

      .title {

        border-radius: 30px;
        background: #acd4ec;
        margin-bottom: 10px;
        text-decoration: none;
        color: #000;
        font-size: 1.5rem;
        transition: 0.3s;
      }
      .btn-link:hover {
        background: #e2e6ea;
      }
      .btn-link img {

      }
