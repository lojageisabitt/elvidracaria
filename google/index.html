<!-- redirect.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando para Google</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Ícones Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Fonte Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fff;
      color: #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .google-title {
      font-size: 3rem;
      font-weight: 600;
      letter-spacing: -1px;
    }

    .google-title span:nth-child(1) { color: #4285F4; } /* G azul */
    .google-title span:nth-child(2) { color: #EA4335; } /* o vermelho */
    .google-title span:nth-child(3) { color: #FBBC05; } /* o amarelo */
    .google-title span:nth-child(4) { color: #4285F4; } /* g azul */
    .google-title span:nth-child(5) { color: #34A853; } /* l verde */
    .google-title span:nth-child(6) { color: #EA4335; } /* e vermelho */

    .stars i {
      color: #fbbc05;
      font-size: 1.4rem;
    }

    .spinner-border {
      width: 3rem;
      height: 3rem;
      color: #4285F4;
      margin-top: 2rem;
    }

    p {
      margin: 1rem;
      color: #555;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div>
    <div class="google-title">
      <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>

    <div class="stars mb-3 mt-1">
      <i class="bi bi-star-fill"></i>
      <i class="bi bi-star-fill"></i>
      <i class="bi bi-star-fill"></i>
      <i class="bi bi-star-fill"></i>
      <i class="bi bi-star-fill"></i>
    </div>

    <div class="spinner-border" role="status">
      <span class="visually-hidden">Carregando...</span>
    </div>

    <p class="redirecionado">Você está sendo redirecionado para a página de avaliações do Google...</p>
  </div>

  <script>
    setTimeout(() => {
      window.location.href = "https://www.google.com/search?sca_esv=602bc0460517bd79&sxsrf=AE3TifPHlhKSscQmFZ58fL4kKFk_VNx0cA:1760720873951&si=AMgyJEtREmoPL4P1I5IDCfuA8gybfVI2d5Uj7QMwYCZHKDZ-EwKL-nyveojwb4x30myirgHsPZSWQ8uxKIivD75YYMT9sbfAOFOAnicLDFaoJMFVEJ-OdEYXf4yvwC040RJq2Tb3pcmPZIeLZEX7SIKkYzmA-g9FBw%3D%3D&q=E+L+Vidra%C3%A7aria+Coment%C3%A1rios&sa=X&ved=2ahUKEwiUg_ax3KuQAxVpILkGHSJHNcoQ0bkNegQIMRAE&biw=1366&bih=599&dpr=1";
    }, 3000);
  </script>
</body>
</html>
